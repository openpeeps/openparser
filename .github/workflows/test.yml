name: test
on:
  push:
    paths-ignore:
      - LICENSE
      - README.*
      - examples
      - .github/workflows
  pull_request:
    paths-ignore:
      - LICENSE
      - README.*
      - examples
      - .github/workflows
jobs:
  nim:
    name: nim tests
    uses: nimbase/setup-nim-action/.github/workflows/test_clue.yml@main
    with:
      nim-version: '2.2.x'
      os: '[{"os":"ubuntu-latest"},{"os":"ubuntu-24.04-arm"},{"os":"macos-15"},{"os":"macos-15-intel"},{"os":"windows-latest"},{"os":"windows-11-arm"}]'
      # Full suite: `clue test` takes the filter as a positional arg and
      # extra flags ride along in test-flags, so `--parallel` runs every
      # module in tests/ on a worker pool.
      test-flags: '--parallel'

