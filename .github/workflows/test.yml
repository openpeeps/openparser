name: test
on:
  push:
    paths-ignore:
      - LICENSE
      - README.*
      - examples
      - .github/workflows
  pull_request:
    paths-ignore:
      - LICENSE
      - README.*
      - examples
      - .github/workflows
jobs:
  nim:
    name: nim tests
    uses: nimbase/setup-nim-action/.github/workflows/test.yml@main
    with:
      nim-version: '2.2.x'
      os: '[{"os":"ubuntu-latest"},{"os":"macos-latest"}]'

  napi:
    name: napi addon
    uses: nimbase/setup-nim-action/.github/workflows/test.yml@main
    with:
      nim-version: '2.2.x'
      os: '[{"os":"ubuntu-latest"},{"os":"macos-latest"}]'
      # Node-side prerequisites, openparser-side only: the runners ship
      # Node + npm + cmake, so only the cmake-js CLI (used by
      # `denim build --cmake`) needs installing. GITHUB_PATH persists the
      # fallback location to the later steps.
      pre-install-command: >-
        npm install -g cmake-js ||
        (npm install --prefix "$HOME/.cmake-js" cmake-js &&
        echo "$HOME/.cmake-js/bin" >> "$GITHUB_PATH")
      pre-test-command: >-
        nimble install denim -y
      # denim build src/openparser.nim --cmake -y &&
      # node addons/openparser_napi/scripts/place-binary.js &&
      # npm test --prefix addons/openparser_napi
